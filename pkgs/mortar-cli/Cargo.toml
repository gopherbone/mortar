[package]
name = "mortar"
version = "0.1.0"
edition = "2021"
description = "Build Mortar on this computer and put it on a TrimUI Brick over SSH"
license = "GPL-2.0-or-later"

[dependencies]
mortar-pair = { path = "../mortar-pair" }
mortar-update = { path = "../mortar-update", default-features = false }
serde_json = "1.0.140"

[profile.release]
opt-level = "s"
strip = true
