# Mortar AI: tmux for Claude Code on the Brick (foot, pad-as-keyboard).
# Sessions outlive the terminal: closing the app (MENU, X X) only detaches.
set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB:extkeys:clipboard"
set -g extended-keys on
set -sg escape-time 10
set -g focus-events on
set -g history-limit 5000
set -g mouse off
set -g set-titles on
set -g set-titles-string "#S"
# The pane's helpers (the sign-in QR window) need the current Wayland socket.
set -ga update-environment " WAYLAND_DISPLAY XDG_RUNTIME_DIR MORTAR_APP"
# Lime status line in the Mortar palette, with what the buttons do.
set -g status-style "bg=#cef058,fg=#1b322d"
set -g status-left " #S "
set -g status-left-length 20
set -g status-right " MENU apps · L1/R1 page · START keyboard "
set -g status-right-length 60
set -g window-status-format ""
set -g window-status-current-format ""
