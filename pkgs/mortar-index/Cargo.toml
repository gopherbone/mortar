[package]
name = "mortar-index"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
description = "What a Mortar publisher and a Brick agree on: signed system manifests and package indexes"
publish = false

# "device" adds what only runs on the Brick: free space, the battery.
[features]
default = []
device = ["dep:libc"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
base64 = "0.22.1"
ed25519-dalek = "2.1"
libc = { version = "0.2.191", optional = true }
