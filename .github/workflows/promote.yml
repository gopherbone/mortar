# SPDX-License-Identifier: GPL-2.0-or-later
# Put what's on the testing channel on the release channel, once a Brick on testing has
# run it (docs/updates.md): push the final tag, v0.1.0, to the commit of the release
# candidate that was tried, or run this by hand. Nothing is built: the closure is in the bucket
# already, the manifest is re-signed for the release channel, and the SD image is copied
# to images/mortar/.
#
# The `release` environment is where required reviewers go (Settings > Environments).
name: Promote to release

on:
  push:
    tags: ["v*", "!v*-*"]
  workflow_dispatch:
    inputs:
      rev:
        description: The commit to promote (a safeguard; it must be what testing has)
        type: string
        required: true
      config:
        description: Which configuration
        type: choice
        options: [both, brick-bare, brick-full]
        default: both

permissions:
  contents: read

env:
  BUCKET: mortar-cache

jobs:
  promote:
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the changelog is the commits since the last release

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Promote
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          NIX_SIGNING_KEY: ${{ secrets.NIX_SIGNING_KEY }}
          MORTAR_PUBLISHER: github-actions
          MORTAR_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          REV: ${{ inputs.rev || github.sha }}
          WHICH: ${{ inputs.config || 'both' }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$R2_ACCOUNT_ID" ] || [ -z "$NIX_SIGNING_KEY" ]; then
            echo "::error::R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY / R2_ACCOUNT_ID / NIX_SIGNING_KEY secrets are missing (docs/updates.md)"
            exit 1
          fi
          key="$RUNNER_TEMP/signing-key"
          trap 'rm -f "$key"' EXIT
          (umask 077; printf '%s\n' "$NIX_SIGNING_KEY" > "$key")
          case "$WHICH" in both) configs="brick-bare brick-full" ;; *) configs=$WHICH ;; esac
          for c in $configs; do
            # A Brick follows what the system it runs says. One that says `testing` would
            # go back to that channel, and to every release candidate, the moment it took this release.
            follows=$(nix eval --raw "git+file://$PWD?rev=$REV#nixosConfigurations.$c.config.mortar.update.channel")
            if [ "$follows" != mortar ]; then
              echo "::error::$REV: $c follows '$follows', not 'mortar'. Set channel = \"mortar\" in configurations/public.nix, push, try that on testing and promote that."
              exit 1
            fi
          done
          for c in $configs; do
            nix run ".#mortar" -- promote --endpoint "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" --bucket "$BUCKET" \
              --from testing --channel mortar --config "$c" --rev "$REV" --key "$key"
          done
