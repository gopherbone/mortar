# SPDX-License-Identifier: GPL-2.0-or-later
# Test Mortar, build it and publish it to the `testing` channel (docs/updates.md).
# Bricks on the release channel get it only when someone runs promote.yml.
#
#   settings   before anything is built: is everything needed to publish there?
#              Every pack and port evaluates, what's published holds only what may
#              be public.
#   vm-tests   the NixOS VM tests, on an x86 runner with KVM
#   build      arm64: the other checks, brick-bare and brick-full; then what of their
#              closures isn't on cache.nixos.org, signed, to the bucket,
#              channels/testing/<config>.json, and their SD images to images/testing/
#
# What must never be in anything public: Claude Code, PICO-8 and game data. None is in brick-bare or brick-full; `settings` and
# `build` check, and fail the run if that changes (modules/unfree.nix). TrimUI's
# files for the Brick are in the closure, as the project has decided
# (docs/updates.md, "What may be published"). Nothing built here is uploaded as a
# workflow artifact.
#
# Secrets (Settings > Secrets and variables > Actions):
#   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY  R2 token with write access to the bucket
#   R2_ACCOUNT_ID                           the Cloudflare account the bucket is in
#   NIX_SIGNING_KEY                         `nix key generate-secret` output
# The public URL and key come from mortar.update in the configuration. The workflow
# reads the cache like anyone, through that URL, and only writes with these.
#
# Runners: GitHub's standard runners are free and unlimited on a public repository,
# arm64 (ubuntu-24.04-arm) included. Fallbacks (Run workflow > runner): `x86-qemu`
# (x86 runner, aarch64 builds emulated: much slower) or `self-hosted` (your own
# runner with the label `mortar`). Never give a self-hosted runner pull requests.
# Without CI at all: `mortar publish` from a computer.
name: Build and publish

on:
  push:
    branches: [mortar]
  pull_request:
  workflow_dispatch:
    inputs:
      runner:
        description: Where to build
        type: choice
        options: [arm, x86-qemu, self-hosted]
        default: arm
      publish:
        description: Publish to the testing channel
        type: boolean
        default: true

# A newer push supersedes a running build. Cancelling never leaves a
# half-published channel: each manifest is written last.
concurrency:
  group: mortar-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CONFIGS: brick-bare brick-full
  BUCKET: mortar-cache
  UPSTREAM: https://cache.nixos.org

jobs:
  settings:
    # Off until the one-time setup is done (docs/updates.md): set the repository
    # variable MORTAR_CI=true. Manual runs and pull requests always work.
    if: vars.MORTAR_CI == 'true' || github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      publish: ${{ steps.publish.outputs.publish }}
      base_url: ${{ steps.bucket.outputs.base_url }}
      public_key: ${{ steps.bucket.outputs.public_key }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Publishing this run?
        id: publish
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.publish }}
        run: |
          if [ "$EVENT" = push ] || { [ "$EVENT" = workflow_dispatch ] && [ "$INPUT" = true ]; }; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Everything evaluates, each pack and port alone
        run: nix eval --json .#lib.evalMatrix | jq -r 'to_entries[] | "\(.key)\t\(.value)"'

      - name: What's published holds only what may be public
        run: |
          nix build --no-link --print-build-logs .#checks.x86_64-linux.public-policy
          bash scripts/check-public-closure.sh $(nix eval --json .#lib.evalMatrix \
            | jq -r '.bare, .full')

      # Fail here, not after hours of building.
      - name: Update settings
        id: bucket
        if: steps.publish.outputs.publish == 'true'
        env:
          HAVE_ID: ${{ secrets.R2_ACCESS_KEY_ID != '' }}
          HAVE_SECRET: ${{ secrets.R2_SECRET_ACCESS_KEY != '' }}
          HAVE_ACCOUNT: ${{ secrets.R2_ACCOUNT_ID != '' }}
          NIX_SIGNING_KEY: ${{ secrets.NIX_SIGNING_KEY }}
        run: |
          fail=0
          err() { echo "::error::$1"; fail=1; }
          [ "$HAVE_ID" = true ] && [ "$HAVE_SECRET" = true ] && [ "$HAVE_ACCOUNT" = true ] && [ -n "$NIX_SIGNING_KEY" ] ||
            err "the R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ACCOUNT_ID and NIX_SIGNING_KEY secrets aren't all set (docs/updates.md)"
          signs_as=$(printf '%s\n' "$NIX_SIGNING_KEY" | nix key convert-secret-to-public 2>/dev/null || true)
          for c in $CONFIGS; do
            nix eval --json ".#nixosConfigurations.$c.config.mortar" \
              --apply 'm: { inherit (m.update) enable baseUrl bucket endpoint publicKey configName channel; upstreams = map (u: u.url) m.update.upstreams; inherit (m.usb) trustHost; }' > "$RUNNER_TEMP/$c.json"
            j() { jq -r "$1" "$RUNNER_TEMP/$c.json"; }
            [ "$(j .enable)" = true ] || err "$c: mortar.update.enable is off (configurations/public.nix)"
            case "$(j .baseUrl)" in https://*) ;; *) err "$c: mortar.update.baseUrl isn't an https:// URL: $(j .baseUrl)" ;; esac
            [ "$(j .bucket)" = null ] && [ "$(j .endpoint)" = null ] || err "$c: a published system must not name a bucket"
            [ "$(j .publicKey)" = "$signs_as" ] || err "$c: NIX_SIGNING_KEY isn't the secret half of mortar.update.publicKey ($(j .publicKey))"
            [ "$(j .configName)" = "$c" ] || err "$c: mortar.update.configName is $(j .configName)"
            [ "$(j .channel)" != null ] && [ -n "$(j .channel)" ] || err "$c: mortar.update.channel isn't set"
            jq -e --arg u "$UPSTREAM" '.upstreams | index($u)' "$RUNNER_TEMP/$c.json" > /dev/null ||
              err "$c: Bricks don't read $UPSTREAM, and what's on it won't be uploaded"
            [ "$(j .trustHost)" = false ] || err "$c: mortar.usb.trustHost is on"
          done
          [ "$fail" = 0 ] || exit 1
          c=${CONFIGS%% *}
          jq -r '"base_url=\(.baseUrl)", "public_key=\(.publicKey)"' "$RUNNER_TEMP/$c.json" >> "$GITHUB_OUTPUT"

  # KVM: x86 runners have it once the device is opened up. GitHub's documentation
  # doesn't promise it on the arm64 ones, so VM tests aren't run there.
  vm-tests:
    needs: settings
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -w /dev/kvm

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm

      - name: VM tests
        run: |
          nix build --no-link --print-build-logs \
            .#checks.x86_64-linux.mortar-update \
            .#checks.x86_64-linux.usb-pairing

  build:
    needs: [settings, vm-tests]
    # Pull requests from a fork carry no secrets and never publish; the arm64 build
    # is a push's or a manual run's: it's the long part.
    if: github.event_name != 'pull_request'
    runs-on: ${{ fromJSON(inputs.runner == 'x86-qemu' && '"ubuntu-24.04"' || inputs.runner == 'self-hosted' && '["self-hosted","mortar"]' || '"ubuntu-24.04-arm"') }}
    timeout-minutes: 360
    steps:
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache \
            /usr/local/share/boost /usr/local/.ghcup /usr/share/swift || true
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the changelog is the commits since the last publish

      - name: Emulate aarch64 (x86 fallback)
        if: inputs.runner == 'x86-qemu'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Install Nix
        if: runner.environment == 'github-hosted'
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = auto
            cores = 0
            fallback = true

      # The public cache is also a substituter, so unchanged paths (the kernel, GPU
      # userspace, Rust apps) are downloaded instead of rebuilt. It takes no credentials.
      - name: Configure Nix
        if: runner.environment == 'github-hosted'
        env:
          BASE_URL: ${{ needs.settings.outputs.base_url }}
          PUBLIC_KEY: ${{ needs.settings.outputs.public_key }}
          QEMU: ${{ inputs.runner == 'x86-qemu' }}
        run: |
          if [ "$QEMU" = true ]; then
            echo "extra-platforms = aarch64-linux" | sudo tee -a /etc/nix/nix.conf
          fi
          if [ -n "$BASE_URL" ]; then
            { echo "extra-substituters = $BASE_URL"; echo "extra-trusted-public-keys = $PUBLIC_KEY"; } \
              | sudo tee -a /etc/nix/nix.conf
          fi
          sudo systemctl daemon-reload
          sudo systemctl restart nix-daemon

      # Everything but the VM tests, which need KVM (vm-tests ran them on x86).
      - name: Checks
        run: |
          nix eval --json .#checks.aarch64-linux --apply builtins.attrNames \
            | jq -r '.[] | select(. != "mortar-update" and . != "usb-pairing") | ".#checks.aarch64-linux." + .' \
            | xargs nix build --no-link --print-build-logs

      # Rooted, because the disk is short (14 GB): garbage collection makes room for the
      # images, keeping these.
      - name: Build
        id: build
        run: |
          : > "$RUNNER_TEMP/built"
          for c in $CONFIGS; do
            top=$(nix build --print-out-paths --out-link "$RUNNER_TEMP/roots/$c" ".#nixosConfigurations.$c.config.system.build.toplevel")
            echo "$c $top" | tee -a "$RUNNER_TEMP/built"
            bash scripts/check-public-closure.sh "$top"
            du -sh $(nix-store --query --requisites "$top") 2>/dev/null | sort -h | tail -5 || true
          done
          nix build --out-link "$RUNNER_TEMP/roots/mortar" .#mortar
          nix build --out-link "$RUNNER_TEMP/roots/u-boot" .#u-boot-mainline
          df -h /

      - name: Publish to testing
        if: needs.settings.outputs.publish == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          NIX_SIGNING_KEY: ${{ secrets.NIX_SIGNING_KEY }}
          MORTAR_PUBLISHER: github-actions
        run: |
          key="$RUNNER_TEMP/signing-key"
          trap 'rm -f "$key"' EXIT
          (umask 077; printf '%s\n' "$NIX_SIGNING_KEY" > "$key")
          while read -r c top; do
            "$RUNNER_TEMP/roots/mortar/bin/mortar" publish \
              --endpoint "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" --bucket "$BUCKET" --upstream "$UPSTREAM" \
              --channel testing --config "$c" --path "$top" --key "$key"
          done < "$RUNNER_TEMP/built"

      # Each image is built, uploaded and collected in turn. They hold the closures just
      # published and the boot chain: nothing check-public-closure.sh hasn't seen but
      # U-Boot and TrimUI's SCP, which are published by decision (docs/updates.md).
      - name: Publish SD images to testing
        if: needs.settings.outputs.publish == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          # not on a self-hosted runner: that store is someone's
          make_room() { if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then nix-collect-garbage; fi; df -h /; }
          make_room
          for pair in brick-bare:sd-image brick-full:sd-image-full; do
            c=${pair%%:*} attr=${pair##*:}
            image=$(nix build --no-link --print-out-paths ".#$attr")
            "$RUNNER_TEMP/roots/mortar/bin/mortar" publish-image \
              --endpoint "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" --bucket "$BUCKET" \
              --channel testing --config "$c" --image "$(echo "$image"/sd-image/*.img.zst)"
            make_room
          done
